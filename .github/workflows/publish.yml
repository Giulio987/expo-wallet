name: 'publish npm'

on:
  push:
    branches:
      - master

# Publishes with npm trusted publishing (OIDC): no NPM_AUTH_TOKEN secret needed.
# The workflow file name must match the Trusted Publisher configured on npmjs.com.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: install
        run: npm ci
      - name: publish (prepublishOnly runs codegen and build)
        run: npm publish --access public
